name: build

# Builds and tests kxgdi on every push and pull request.
# Pushing a tag like v0.1.0 additionally publishes a GitHub release with the zip.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build, test and package
        shell: pwsh
        run: ./tools/package.ps1 -CI

      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Get-FileHash out/x64/kxgdi.dll, out/x64/kxgdi-test.exe, dist/kxgdi-win7-x64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Tee-Object dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: kxgdi-win7-x64
          path: |
            dist/kxgdi-win7-x64.zip
            dist/SHA256SUMS.txt
            out/x64/*.pdb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kxgdi-win7-x64

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "kxgdi $GITHUB_REF_NAME" \
            --prerelease \
            --notes "Experimental build. Not yet confirmed on Windows 7 - please run kxgdi-test.exe first and report the result. Built by GitHub Actions from commit $GITHUB_SHA." \
            dist/kxgdi-win7-x64.zip dist/SHA256SUMS.txt
