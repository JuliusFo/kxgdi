name: build

# Builds and tests kxgdi on every push and pull request.
#
# Releases: run this workflow manually (Actions -> build -> Run workflow) with a
# version such as v1.1.0. It creates a *draft* release with the zip and
# checksums, using the matching section of CHANGELOG.md as release notes.
# Drafts are only visible to people with write access to the repository; the
# tag is created when the draft is published on GitHub.
#
# By default the draft is a normal release, which becomes "Latest release" on
# the repository page when published. Tick "pre-release" only for test builds:
# GitHub does not show pre-releases as the latest release, so most visitors
# will not find them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a draft release (e.g. v1.1.0). Leave empty to only build.'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release (test builds only; not shown as the latest release)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build, test and package
        shell: pwsh
        run: ./tools/package.ps1 -CI

      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Get-FileHash out/x64/kxgdi.dll, out/x64/kxgdildr.dll, dist/kxgdi-win7-x64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Tee-Object dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: kxgdi-win7-x64
          path: |
            dist/kxgdi-win7-x64.zip
            dist/SHA256SUMS.txt
            out/x64/*.pdb

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: kxgdi-win7-x64

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid version '$VERSION' (expected e.g. v0.1.0)"; exit 1
          fi

          # Release notes: the "## <version>" section of CHANGELOG.md.
          awk -v v="## $VERSION" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "No section '## $VERSION' in CHANGELOG.md"; exit 1
          fi
          printf '\n---\nBuilt by GitHub Actions from commit %s.\n' "$GITHUB_SHA" >> notes.md

          flags=(--draft)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi

          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            "${flags[@]}" \
            --target "$GITHUB_SHA" \
            --title "kxgdi $VERSION" \
            --notes-file notes.md \
            dist/kxgdi-win7-x64.zip dist/SHA256SUMS.txt
