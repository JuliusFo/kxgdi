name: build

# Builds and tests kxgdi on every push and pull request.
#
# Releases: run this workflow manually (Actions -> build -> Run workflow) with a
# version such as v0.1.0. It creates a *draft* pre-release with the zip and
# checksums, using the matching section of CHANGELOG.md as release notes.
# Drafts are only visible to the repository owner; the tag is created when the
# draft is published on GitHub.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a draft release (e.g. v0.1.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build, test and package
        shell: pwsh
        run: ./tools/package.ps1 -CI

      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Get-FileHash out/x64/kxgdi.dll, out/x64/kxgdi-test.exe, dist/kxgdi-win7-x64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Tee-Object dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: kxgdi-win7-x64
          path: |
            dist/kxgdi-win7-x64.zip
            dist/SHA256SUMS.txt
            out/x64/*.pdb

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: kxgdi-win7-x64

      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid version '$VERSION' (expected e.g. v0.1.0)"; exit 1
          fi

          # Release notes: the "## <version>" section of CHANGELOG.md.
          awk -v v="## $VERSION" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "No section '## $VERSION' in CHANGELOG.md"; exit 1
          fi
          printf '\n---\nBuilt by GitHub Actions from commit %s.\n' "$GITHUB_SHA" >> notes.md

          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease \
            --target "$GITHUB_SHA" \
            --title "kxgdi $VERSION" \
            --notes-file notes.md \
            dist/kxgdi-win7-x64.zip dist/SHA256SUMS.txt
